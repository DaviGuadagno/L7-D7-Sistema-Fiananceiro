<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team L7 — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0a0a;
    --panel: #161616;
    --panel-2: #1e1e1e;
    --red: #9c1414;
    --red-bright: #c81e1e;
    --silver: #b8b8bc;
    --silver-bright: #e8e8ec;
    --white: #f4f4f5;
    --line: #2a2a2a;
    --green: #3fae5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #1a0d0d 0%, transparent 45%),
      radial-gradient(ellipse at 90% 110%, #150c0c 0%, transparent 45%),
      var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap{ max-width: 980px; margin: 0 auto; }

  /* HEADER — raio / lightning motif */
  header{ display:flex; align-items:center; gap:18px; margin-bottom: 36px; position:relative; }
  .logo{
    width: 48px; height: 48px; flex-shrink:0; object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(156,20,20,0.35));
  }
  h1{
    font-family:'Oswald', sans-serif; font-weight:700; letter-spacing: 0.5px;
    font-size: 28px; text-transform: uppercase; color: var(--silver-bright);
  }
  h1 span{ color: var(--red-bright); }
  header p{ font-size: 13px; color: #8a8a8e; margin-top: 2px; letter-spacing: 0.3px; }

  /* MONTH SELECTOR */
  .month-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--panel); border:1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; margin-bottom: 28px;
  }
  .month-bar button{
    background:none; border:1px solid var(--line); color: var(--silver-bright);
    width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:16px;
    transition: border-color .15s;
  }
  .month-bar button:hover{ border-color: var(--red-bright); }
  .month-label{ font-family:'Oswald'; font-size:16px; letter-spacing:1px; text-transform:uppercase; color: var(--silver-bright); }

  .report-btn{
    width:100%; padding: 13px; margin-bottom: 28px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--silver-bright);
    font-family:'Oswald'; font-weight:600; text-transform:uppercase; letter-spacing:1px;
    font-size: 13px; cursor:pointer; transition: all .15s;
  }
  .report-btn:hover{ border-color: var(--silver); }

  /* PRINT REPORT — hidden on screen, shown only when printing */
  #reportPrint{ display:none; }
  @media print{
    body *{ visibility: hidden; }
    #reportPrint, #reportPrint *{ visibility: visible; }
    #reportPrint{
      display:block; position:absolute; top:0; left:0; width:100%;
      background:#fff; color:#111; padding:24px; font-family: 'Inter', sans-serif;
    }
    #reportPrint h2{ font-family:'Oswald'; font-size:22px; margin-bottom:2px; text-transform:uppercase; }
    #reportPrint .sub{ font-size:12px; color:#555; margin-bottom:20px; }
    #reportPrint h3{ font-size:14px; text-transform:uppercase; letter-spacing:0.5px; margin:18px 0 8px; border-bottom:1px solid #ccc; padding-bottom:4px; }
    #reportPrint table{ width:100%; border-collapse:collapse; font-size:13px; }
    #reportPrint td{ padding: 5px 0; border-bottom: 1px solid #eee; }
    #reportPrint td:last-child{ text-align:right; font-weight:600; }
    #reportPrint .totals{ margin-top:20px; padding-top:12px; border-top:2px solid #111; font-size:14px; }
    #reportPrint .totals div{ display:flex; justify-content:space-between; padding:4px 0; }
    #reportPrint .totals .final{ font-weight:700; font-size:16px; margin-top:6px; }
  }

  /* SUMMARY GRID */
  .summary{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 30px; }
  @media (max-width: 720px){ .summary{ grid-template-columns: repeat(2, 1fr); } }
  .card{
    background: linear-gradient(155deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px;
    position: relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--silver)), transparent);
  }
  .card.receita::before{ --accent: var(--green); }
  .card.despesa::before{ --accent: var(--red-bright); }
  .card.lucro::before{ --accent: var(--silver-bright); }
  .card .label{ font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8a8a8e; margin-bottom: 8px; }
  .card .value{ font-family:'Oswald'; font-size: 24px; font-weight:600; color: var(--white); }
  .card.receita .value{ color: var(--green); }
  .card.despesa .value{ color: #e15a5a; }

  /* SPLIT — metallic plates */
  .split{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom: 32px; }
  @media (max-width: 620px){ .split{ grid-template-columns: 1fr; } }
  .plate{
    background: linear-gradient(135deg, #2c2c30, #131315 55%, #232326);
    border: 1px solid #3a3a3e; border-radius: 12px; padding: 20px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .plate .who{ font-family:'Oswald'; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--silver); }
  .plate .amt{ font-family:'Oswald'; font-size: 26px; font-weight:700; color: var(--silver-bright); margin-top:4px; }
  .plate .pct{ font-size:11px; color:#7a7a7e; margin-top:2px; }

  /* FORM */
  .panel{ background: var(--panel); border:1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .panel h2{ font-family:'Oswald'; font-size:15px; text-transform:uppercase; letter-spacing:1px; color: var(--silver-bright); margin-bottom: 16px; }
  .toggle{ display:flex; gap:8px; margin-bottom: 16px; }
  .toggle button{
    flex:1; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: #8a8a8e; font-family:'Inter'; font-weight:600; font-size:13px;
    cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; transition: all .15s;
  }
  .toggle button.active.entrada{ background: rgba(63,174,92,0.15); border-color: var(--green); color: var(--green); }
  .toggle button.active.saida{ background: rgba(200,30,30,0.15); border-color: var(--red-bright); color: #e15a5a; }

  .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 620px){ .form-grid{ grid-template-columns: 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size: 11px; text-transform:uppercase; letter-spacing:0.5px; color:#8a8a8e; }
  .field input, .field select{
    background: var(--black); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; color: var(--white); font-family:'Inter'; font-size: 14px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--red-bright); }
  .full{ grid-column: 1 / -1; }
  .submit-btn{
    margin-top: 14px; width:100%; padding: 12px; border:none; border-radius: 8px;
    background: linear-gradient(135deg, var(--red-bright), var(--red)); color: white;
    font-family:'Oswald'; font-weight:600; text-transform:uppercase; letter-spacing:1px;
    font-size: 14px; cursor:pointer; transition: filter .15s;
  }
  .submit-btn:hover{ filter: brightness(1.15); }

  /* TABLE */
  .list h2{ font-family:'Oswald'; font-size:15px; text-transform:uppercase; letter-spacing:1px; color: var(--silver-bright); margin-bottom: 14px; }
  .entry{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 12px 14px; border-radius: 8px; background: var(--panel); border:1px solid var(--line);
    margin-bottom: 8px;
  }
  .entry .info{ display:flex; flex-direction:column; gap:2px; }
  .entry .cat{ font-size:13px; font-weight:600; color: var(--white); }
  .entry .meta{ font-size:11px; color:#7a7a7e; }
  .entry .right{ display:flex; align-items:center; gap:14px; }
  .entry .val{ font-family:'Oswald'; font-size:15px; font-weight:600; }
  .entry.entrada .val{ color: var(--green); }
  .entry.saida .val{ color: #e15a5a; }
  .del{ background:none; border:none; color:#5a5a5e; cursor:pointer; font-size:16px; padding:4px; }
  .del:hover{ color: var(--red-bright); }
  .empty{ text-align:center; padding: 30px; color:#5a5a5e; font-size:13px; }
</style>
</head>

const firebaseConfig = {

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, 'l7financeiro', 'lancamentos');

const CATS = {
entrada: ['Mensalidades', 'Personal / Aulas avulsas', 'Eventos (L7 Day)', 'Patrocínio', 'Loja / Produtos', 'Outros'],
saida: ['Aluguel de quadra', 'Folha / Instrutores', 'Manutenção', 'Marketing', 'Material esportivo', 'Impostos', 'Outros']
};

let currentType = 'entrada';
let allEntries = [];
let viewDate = new Date();

function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function fmtMoney(v){ return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function fmtMonthLabel(d){
return d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}).toUpperCase();
}

function setType(t){
currentType = t;
document.getElementById('btnEntrada').classList.toggle('active', t==='entrada');
document.getElementById('btnSaida').classList.toggle('active', t==='saida');
populateCategories();
}

function populateCategories(){
const sel = document.getElementById('fCategoria');
sel.innerHTML = '';
CATS[currentType].forEach(c=>{
const opt = document.createElement('option');
opt.value = c; opt.textContent = c;
sel.appendChild(opt);
});
const customOpt = document.createElement('option');
customOpt.value = '__custom__';
customOpt.textContent = 'Outra (digitar)';
sel.appendChild(customOpt);
toggleCustomCategory();
}

function toggleCustomCategory(){
const sel = document.getElementById('fCategoria');
const wrap = document.getElementById('fCategoriaCustomWrap');
wrap.style.display = sel.value === '__custom__' ? 'flex' : 'none';
}

async function loadEntries(){
try{
const snap = await getDoc(docRef);
allEntries = snap.exists() ? (snap.data().entries || []) : [];
}catch(e){
console.error('Erro ao carregar lançamentos', e);
allEntries = [];
}
render();
}

async function saveEntries(){
try{
await setDoc(docRef, { entries: allEntries });
}catch(e){
console.error('Erro ao salvar', e);
alert('Não foi possível salvar. Tente novamente.');
}
}

async function addEntry(){
const valorInput = document.getElementById('fValor');
const dataInput = document.getElementById('fData');
const catInput = document.getElementById('fCategoria');
const descInput = document.getElementById('fDesc');

const valor = parseFloat(valorInput.value);
const data = dataInput.value || new Date().toISOString().slice(0,10);

if(!valor || valor <= 0){
alert('Informe um valor válido.');
return;
}

let category = catInput.value;
if(category === '__custom__'){
const customInput = document.getElementById('fCategoriaCustom');
category = customInput.value.trim();
if(!category){
alert('Descreva a categoria personalizada.');
return;
}
customInput.value = '';
}

allEntries.push({
id: Date.now().toString(),
type: currentType,
category: category,
description: descInput.value.trim(),
value: valor,
date: data
});

await saveEntries();
valorInput.value = '';
descInput.value = '';
render();
}

async function deleteEntry(id){
allEntries = allEntries.filter(e => e.id !== id);
await saveEntries();
render();
}

function render(){
document.getElementById('monthLabel').textContent = fmtMonthLabel(viewDate);
const mk = monthKey(viewDate);
const monthEntries = allEntries.filter(e => e.date.startsWith(mk));

const receita = monthEntries.filter(e=>e.type==='entrada').reduce((s,e)=>s+e.value,0);
const despesa = monthEntries.filter(e=>e.type==='saida').reduce((s,e)=>s+e.value,0);
const lucro = receita - despesa;
const margem = receita > 0 ? (lucro/receita*100) : 0;

document.getElementById('totalReceita').textContent = fmtMoney(receita);
document.getElementById('totalDespesa').textContent = fmtMoney(despesa);
document.getElementById('lucroLiquido').textContent = fmtMoney(lucro);
document.getElementById('lucroLiquido').style.color = lucro >= 0 ? '#e8e8ec' : '#e15a5a';
document.getElementById('margem').textContent = margem.toFixed(1) + '%';

const list = document.getElementById('entriesList');
if(monthEntries.length === 0){
list.innerHTML = '<div class="empty">Nenhum lançamento neste mês ainda.</div>';
return;
}

const sorted = [...monthEntries].sort((a,b)=> b.date.localeCompare(a.date));
list.innerHTML = sorted.map(e => `
<div class="entry ${e.type}">
<div class="info">
<div class="cat">${e.category}${e.description ? ' — ' + e.description : ''}</div>
<div class="meta">${new Date(e.date + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
</div>
<div class="right">
<div class="val">${e.type === 'entrada' ? '+' : '−'} ${fmtMoney(e.value)}</div>
<button class="del" onclick="deleteEntry('${e.id}')">✕</button>
</div>
</div>
`).join('');
}

document.getElementById('prevMonth').onclick = ()=>{
viewDate.setMonth(viewDate.getMonth()-1);
render();
};
document.getElementById('nextMonth').onclick = ()=>{
viewDate.setMonth(viewDate.getMonth()+1);
render();
};

function generateReport(){
const mk = monthKey(viewDate);
const monthEntries = allEntries.filter(e => e.date.startsWith(mk));

const entradas = monthEntries.filter(e=>e.type==='entrada');
const saidas = monthEntries.filter(e=>e.type==='saida');

const receita = entradas.reduce((s,e)=>s+e.value,0);
const despesa = saidas.reduce((s,e)=>s+e.value,0);
const lucro = receita - despesa;
const margem = receita > 0 ? (lucro/receita*100) : 0;

function byCategory(list){
const map = {};
list.forEach(e => { map[e.category] = (map[e.category] || 0) + e.value; });
return Object.entries(map).sort((a,b) => b[1]-a[1]);
}

function rows(list){
if(list.length === 0) return '<tr><td colspan="2" style="color:#888;">Nenhum lançamento</td></tr>';
return list.map(([cat, val]) => `<tr><td>${cat}</td><td>${fmtMoney(val)}</td></tr>`).join('');
}

const html = `
<h2>Team L7 — Relatório Financeiro</h2>
<div class="sub">${fmtMonthLabel(viewDate)} · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>

<h3>Receitas por categoria</h3>
<table>${rows(byCategory(entradas))}</table>

<h3>Despesas por categoria</h3>
<table>${rows(byCategory(saidas))}</table>

<div class="totals">
<div><span>Receita total</span><span>${fmtMoney(receita)}</span></div>
<div><span>Despesas totais</span><span>${fmtMoney(despesa)}</span></div>
<div class="final"><span>Lucro líquido</span><span>${fmtMoney(lucro)}</span></div>
<div><span>Margem</span><span>${margem.toFixed(1)}%</span></div>
</div>
`;

document.getElementById('reportPrint').innerHTML = html;
window.print();
}

window.setType = setType;
window.toggleCustomCategory = toggleCustomCategory;
window.addEntry = addEntry;
window.deleteEntry = deleteEntry;
window.generateReport = generateReport;

document.getElementById('fData').valueAsDate = new Date();
populateCategories();
loadEntries();
</script>
</body>
